# Configuración de Hardware
# =========================
#
# Este archivo define la asignación de pines y configuración
# específica del hardware conectado.

# Asignación de pines GPIO (numeración BCM)
# Formato: motor, pin_step, pin_dir, pin_enable

motor_x:
  step_pin: 17
  dir_pin: 27
  enable_pin: 22

motor_y:
  step_pin: 23
  dir_pin: 24
  enable_pin: 25

motor_z:
  step_pin: 5
  dir_pin: 6
  enable_pin: 13

motor_a:
  step_pin: 19
  dir_pin: 26
  enable_pin: 16

motor_b:
  step_pin: 20
  dir_pin: 21
  enable_pin: 12

# Configuración de endstops
endstops:
  x_pin: 18
  y_pin: 15
  z_pin: 14

# Configuración de pantalla OLED
oled:
  i2c_address: 0x3C
  width: 128
  height: 64
  i2c_bus: 1

# Configuración de spindle (futuro)
spindle:
  enable_pin: 0
  direction_pin: 0
  pwm_pin: 0
  pwm_frequency: 1000
