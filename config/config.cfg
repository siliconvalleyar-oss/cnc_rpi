# Configuración del CNC Controller
# ==================================
#
# Este archivo contiene la configuración general del sistema.
# Los valores están en sistema métrico (mm).

# Resolución de pasos por milímetro para cada eje
# Calcular: (pasos_por_vuelta * microstepping) / (paso_correa o husillo)
steps_per_mm_x: 80.0
steps_per_mm_y: 80.0
steps_per_mm_z: 400.0
steps_per_mm_a: 80.0
steps_per_mm_b: 80.0

# Velocidades máximas (mm/min)
max_feed_rate_x: 3000
max_feed_rate_y: 3000
max_feed_rate_z: 1000
max_feed_rate_a: 1000
max_feed_rate_b: 1000

# Velocidad de homing (mm/min)
homing_feed_rate: 500

# Aceleración (mm/s²)
acceleration: 100

# Límites de recorrido (mm)
travel_x: 300
travel_y: 200
travel_z: 50
travel_a: 360
travel_b: 360

# Dirección de homing
# true = positivo, false = negativo
homing_direction_x: false
homing_direction_y: false
homing_direction_z: true

# Dirección de los motores (invertir si es necesario)
invert_x: false
invert_y: false
invert_z: false
invert_a: false
invert_b: false

# Configuración de endstops
# true = activo bajo (normalmente cerrado)
endstop_invert_x: false
endstop_invert_y: false
endstop_invert_z: false
